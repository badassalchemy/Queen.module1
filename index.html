function App() {
  const [theme, setTheme] = useState("dark");
  const [active, setActive] = useState(0);
  const [done, setDone] = useState({});
  const [journals, setJournals] = useState({});
  const [copied, setCopied] = useState(false);
  const [mobileNav, setMobileNav] = useState(false);
  const [saveStatus, setSaveStatus] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [exportMenuOpen, setExportMenuOpen] = useState(null);
  const [googleToken, setGoogleToken] = useState(null);

  const C = theme === "dark" ? DARK : LIGHT;

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s.theme) setTheme(s.theme);
        if (s.done) setDone(s.done);
        if (s.journals) setJournals(s.journals);
      }
    } catch (err) {}
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ theme, done, journals }));
    } catch (err) {}
  }, [theme, done, journals, loaded]);

  const toggleTheme = () => setTheme(theme === "dark" ? "light" : "dark");
  const toggleDone = (i) => setDone({ ...done, [i]: !done[i] });

  const updateJournal = (fieldId, text) => {
    const existing = journals[fieldId] || {};
    setJournals({ ...journals, [fieldId]: { text, savedAt: existing.savedAt } });
  };

  const saveLessonJournals = () => {
    const stamp = new Date().toISOString();
    const next = { ...journals };
    const lesson = MODULE_DATA.lessons[active];
    const ids = [];
    if (lesson.journals) lesson.journals.forEach(j => ids.push(j.id));
    if (lesson.intakeForm) lesson.intakeForm.forEach(s => s.fields.forEach(f => ids.push(f.id)));
    if (lesson.letterFieldId) ids.push(lesson.letterFieldId);
    if (lesson.patternFlow) {
      ["step1", "step2", "step3", "step4"].forEach(k => {
        const step = lesson.patternFlow[k];
        if (step && step.fields) step.fields.forEach(f => ids.push(f.id));
      });
    }
    ids.forEach(id => {
      if (next[id] && next[id].text) next[id] = { ...next[id], savedAt: stamp };
    });
    setJournals(next);
    setSaveStatus("Saved ✦");
    setTimeout(() => setSaveStatus(""), 2000);
  };

  const copyText = (text) => {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;left:-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (err) {}
  };

  const getEntries = (lesson) => {
    const out = [];
    if (lesson.journals) lesson.journals.forEach(j => {
      const e = journals[j.id];
      if (e && e.text) out.push({ prompt: j.prompt, text: e.text });
    });
    if (lesson.intakeForm) lesson.intakeForm.forEach(s => s.fields.forEach(f => {
      const e = journals[f.id];
      if (e && e.text) out.push({ prompt: s.section + " — " + f.label, text: e.text });
    }));
    if (lesson.letterFieldId) {
      const e = journals[lesson.letterFieldId];
      if (e && e.text) out.push({ prompt: lesson.title, text: e.text });
    }
    if (lesson.patternFlow) {
      ["step1", "step2", "step3", "step4"].forEach(stepKey => {
        const step = lesson.patternFlow[stepKey];
        if (step && step.fields) {
          step.fields.forEach(f => {
            const e = journals[f.id];
            if (e && e.text) out.push({ prompt: step.title + " — " + f.label, text: e.text });
          });
        }
      });
    }
    return out;
  };

  const download = (filename, content) => {
    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const downloadPDF = (filename, title, entries) => {
    if (!window.jspdf) {
      setSaveStatus("PDF loading...");
      setTimeout(() => setSaveStatus(""), 2000);
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 60;
    const contentWidth = pageWidth - margin * 2;
    let y = margin;

    // Header band — deep mauve
    doc.setFillColor(110, 56, 101);
    doc.rect(0, 0, pageWidth, 90, "F");

    // Title
    doc.setFont("times", "bold");
    doc.setFontSize(22);
    doc.setTextColor(255, 255, 255);
    doc.text("Quantum Queen", margin, 42);

    // Subtitle
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.setTextColor(58, 30, 51);
    doc.text("BADASS ALCHEMY · BADDIE SOCIETY", margin, 58);

    // Module + lesson title
    doc.setFont("times", "italic");
    doc.setFontSize(13);
    doc.setTextColor(255, 255, 255);
    doc.text(MODULE_DATA.title + " — " + MODULE_DATA.subtitle, margin, 76);

    y = 130;

    // Lesson title
    doc.setFont("times", "bold");
    doc.setFontSize(20);
    doc.setTextColor(58, 30, 51);
    doc.text(title, margin, y);
    y += 24;

    // Date
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.setTextColor(155, 112, 144);
    doc.text("Saved " + new Date().toLocaleString(), margin, y);
    y += 30;

    if (entries.length === 0) {
      doc.setFont("helvetica", "italic");
      doc.setFontSize(12);
      doc.setTextColor(120, 90, 110);
      doc.text("No entries yet.", margin, y);
    } else {
      entries.forEach((entry, i) => {
        // Prompt
        doc.setFont("times", "bolditalic");
        doc.setFontSize(13);
        doc.setTextColor(110, 56, 101);
        const promptLines = doc.splitTextToSize(entry.prompt, contentWidth);
        promptLines.forEach(line => {
          if (y > pageHeight - margin) { doc.addPage(); y = margin; }
          doc.text(line, margin, y);
          y += 17;
        });
        y += 6;

        // Answer
        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        doc.setTextColor(60, 40, 55);
        const textLines = doc.splitTextToSize(entry.text, contentWidth);
        textLines.forEach(line => {
          if (y > pageHeight - margin) { doc.addPage(); y = margin; }
          doc.text(line, margin, y);
          y += 15;
        });
        y += 20;

        if (i < entries.length - 1) {
          if (y > pageHeight - margin - 20) { doc.addPage(); y = margin; }
          doc.setDrawColor(220, 200, 215);
          doc.setLineWidth(0.5);
          doc.line(margin, y, pageWidth - margin, y);
          y += 25;
        }
      });
    }

    // Footer on each page
    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.setTextColor(155, 112, 144);
      doc.text("Badass Alchemy · Baddie Society · Quantum Queen", margin, pageHeight - 30);
      doc.text("Page " + i + " of " + pageCount, pageWidth - margin - 50, pageHeight - 30);
    }

    doc.save(filename);
  };

  // Google Drive — request access token then upload
  const authorizeGoogle = () => {
    return new Promise((resolve, reject) => {
      if (googleToken && googleToken.expiresAt > Date.now()) {
        resolve(googleToken.access_token);
        return;
      }
      if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
        reject(new Error("Google library not loaded"));
        return;
      }
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GOOGLE_SCOPES,
        callback: (response) => {
          if (response.access_token) {
            const tok = {
              access_token: response.access_token,
              expiresAt: Date.now() + (response.expires_in || 3600) * 1000
            };
            setGoogleToken(tok);
            resolve(response.access_token);
          } else {
            reject(new Error("Authorization failed"));
          }
        },
        error_callback: (err) => reject(err)
      });
      client.requestAccessToken();
    });
  };

  const uploadToDrive = async (filename, content, mimeType) => {
    if (GOOGLE_CLIENT_ID === "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com") {
      alert("Google Drive isn't configured yet. Please add your Google OAuth Client ID to the file. See instructions in the README.");
      return;
    }
    try {
      setSaveStatus("Connecting to Drive...");
      const token = await authorizeGoogle();
      setSaveStatus("Uploading to Drive...");

      const metadata = { name: filename, mimeType: mimeType };
      const boundary = "qq_boundary_" + Date.now();
      const delimiter = "\r\n--" + boundary + "\r\n";
      const closeDelimiter = "\r\n--" + boundary + "--";

      let body;
      if (mimeType === "application/pdf") {
        // Need base64 encoding for binary
        const reader = new FileReader();
        const base64 = await new Promise((res) => {
          reader.onload = () => res(reader.result.split(",")[1]);
          reader.readAsDataURL(content);
        });
        body =
          delimiter +
          "Content-Type: application/json\r\n\r\n" +
          JSON.stringify(metadata) +
          delimiter +
          "Content-Type: " + mimeType + "\r\n" +
          "Content-Transfer-Encoding: base64\r\n\r\n" +
          base64 +
          closeDelimiter;
      } else {
        body =
          delimiter +
          "Content-Type: application/json\r\n\r\n" +
          JSON.stringify(metadata) +
          delimiter +
          "Content-Type: " + mimeType + "\r\n\r\n" +
          content +
          closeDelimiter;
      }

      const response = await fetch(
        "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
        {
          method: "POST",
          headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "multipart/related; boundary=" + boundary
          },
          body: body
        }
      );

      if (response.ok) {
        setSaveStatus("✦ Saved to Drive!");
        setTimeout(() => setSaveStatus(""), 3000);
      } else {
        setSaveStatus("Drive upload failed");
        setTimeout(() => setSaveStatus(""), 3000);
      }
    } catch (err) {
      setSaveStatus("Drive: " + (err.message || "error"));
      setTimeout(() => setSaveStatus(""), 3000);
    }
  };

  const exportLessonTxt = (lesson) => {
    const entries = getEntries(lesson);
    const body = entries.length === 0 ? "No entries yet." : entries.map(en => en.prompt + "\n\n" + en.text + "\n\n────────────").join("\n\n");

    download("quantum-queen-" + lesson.title.toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".txt", content);
  };

    y += 24;

          doc.text(line, margin, y);
          y += 15;
        });
        y += 20;
        if (i < entries.length - 1) {
          if (y > pageHeight - margin - 20) { doc.addPage(); y = margin; }
          doc.setDrawColor(220, 200, 215);
          doc.setLineWidth(0.5);
          doc.line(margin, y, pageWidth - margin, y);
          y += 25;
        }
      });
    }
    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.setTextColor(155, 112, 144);
      doc.text("Badass Alchemy · Baddie Society · Quantum Queen", margin, pageHeight - 30);
      doc.text("Page " + i + " of " + pageCount, pageWidth - margin - 50, pageHeight - 30);
    }

    const pdfBlob = doc.output("blob");
    const filename = "quantum-queen-" + lesson.title.toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".pdf";
    await uploadToDrive(filename, pdfBlob, "application/pdf");
  };

  const exportAll = () => {
    const sections = MODULE_DATA.lessons.map(l => {
      const ents = getEntries(l);
      if (ents.length === 0) return null;
      return l.title.toUpperCase() + "\n\n" + ents.map(en => en.prompt + "\n\n" + en.text).join("\n\n────────\n\n");
    }).filter(Boolean).join("\n\n═════════════\n\n");
    const content = "BADASS ALCHEMY · QUANTUM QUEEN\n" + MODULE_DATA.title + " — " + MODULE_DATA.subtitle + "\nFull Journal Export\nExported: " + new Date().toLocaleString() + "\n\n═════════════\n\n" + (sections || "No entries yet.");
    download("quantum-queen-module-1-full-journal.txt", content);
  };

  const doneCount = Object.values(done).filter(Boolean).length;
  const progress = Math.round((doneCount / MODULE_DATA.lessons.length) * 100);
  const lesson = MODULE_DATA.lessons[active];
  const sidebarOverlay = theme === "dark"
    ? "linear-gradient(180deg, rgba(31,19,32,0.78) 0%, rgba(42,26,45,0.85) 100%)"
    : "linear-gradient(180deg, rgba(251,245,248,0.88) 0%, rgba(245,232,239,0.92) 100%)";

  return (
    <div style={{ fontFamily: "'Montserrat',sans-serif", background: C.bg, color: C.txtSec, height: "100vh", display: "flex", flexDirection: "column", overflow: "hidden" }}>

      {/* TOP BAR */}
      <div style={{ background: BRAND_GRAD, padding: "0 24px", height: 64, display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0, borderBottom: "1px solid " + C.border }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={() => setMobileNav(!mobileNav)} className="mobile-only" style={{ background: "none", border: "none", color: "#3A1E33", fontSize: 20, cursor: "pointer", padding: 4 }}>☰</button>
          <div style={{ width: 36, height: 36, borderRadius: 10, background: "rgba(255,255,255,0.3)", display: "flex", alignItems: "center", justifyContent: "center", border: "1px solid rgba(255,255,255,0.4)" }}>
            <span style={{ color: "#3A1E33", fontSize: 16, fontWeight: 700 }}>✦</span>
          </div>
          <div>
            <div style={{ fontFamily: "'Cormorant Garamond',serif", fontWeight: 700, fontSize: 18, color: "#FFFFFF", lineHeight: 1 }}>Quantum Queen</div>
            <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 1.5, color: "#3A1E33", textTransform: "uppercase", marginTop: 3 }}>Badass Alchemy · Baddie Society</div>
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 24 }}>
          <div style={{ display: "flex", gap: 24 }} className="desktop-only">
            <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: 1.5, color: "#FFFFFF", textTransform: "uppercase", borderBottom: "2px solid #3A1E33", paddingBottom: 22, paddingTop: 22 }}>Classroom</span>

        <div className={mobileNav ? "sidebar open" : "sidebar"} style={{

            <div style={{ fontSize: 8, fontWeight: 700, letterSpacing: 1.5, color: theme === "dark" ? C.accentLt : C.accent, textTransform: "uppercase", marginBottom: 6 }}>{MODULE_DATA.title}</div>

            </div>

              <button onClick={() => toggleDone(active)} style={{ flexShrink: 0, marginTop: 6, fontSize: 9, fontWeight: 700, letterSpacing: 1.2, padding: "10px 18px", borderRadius: 50, border: done[active] ? "none" : "1px solid " + C.borderMid, cursor: "pointer", background: done[active] ? "linear-gradient(135deg," + C.accent + "," + C.accentLt + ")" : "transparent", color: done[active] ? C.moonPrl : C.txtMuted, textTransform: "uppercase" }}>
                {done[active] ? "✦ Complete" : "○ Mark Complete"}

                      <textarea
                        value={(journals[f.id] && journals[f.id].text) || ""}
                        onChange={(ev) => updateJournal(f.id, ev.target.value)}

                        rows={3}
                        style={{ width: "100%", background: C.inputBg, border: "1px solid " + C.border, borderRadius: 10, padding: "14px 16px", fontSize: 13.5, color: C.txtSec, lineHeight: 1.7, resize: "vertical" }}

                    <div style={{ width: 36, height: 36, borderRadius: "50%", background: "linear-gradient(135deg," + C.accent + "," + C.accentLt + ")", display: "flex", alignItems: "center", justifyContent: "center", color: "#FFFFFF", fontWeight: 800, fontSize: 12, flexShrink: 0 }}>04</div>

                    <div key={f.id} style={{ marginBottom: 14 }}>

                      <textarea
                        value={(journals[f.id] && journals[f.id].text) || ""}
                        onChange={(ev) => updateJournal(f.id, ev.target.value)}

                        rows={4}
                        style={{ width: "100%", background: C.inputBg, border: "1px solid " + C.border, borderRadius: 10, padding: "14px 16px", fontSize: 13.5, color: C.txtSec, lineHeight: 1.7, resize: "vertical" }}
                      />
                    </div>
                  ))}
                </div>

                <SaveExportButtons
                  onSave={saveLessonJournals}
                  onExportTxt={() => exportLessonTxt(lesson)}
                  onExportPDF={() => exportLessonPDF(lesson)}
                  onExportDrive={() => exportLessonToDrive(lesson)}
                  C={C}
                  saveLabel="✦ Save Pattern Work"
                  menuId="pattern"
                  exportMenuOpen={exportMenuOpen}
                  setExportMenuOpen={setExportMenuOpen}
                />
                <div style={{ fontWeight: 500, fontSize: 11, color: C.txtFaded, lineHeight: 1.7, marginTop: 14, letterSpacing: 0.3 }}>
                  This is sacred data. Save it. Download a PDF and keep it close — you will reference your pattern again in Modules 3, 4, and 5.

              </div>
            )}

            {lesson.letterPrompts && (
              <div style={{ marginBottom: 36 }}>
                <SectionHeader icon="💌" label="Write Your Letter" color={C.accent} status={saveStatus} />
                <div style={{ background: C.bgCard, borderRadius: 14, border: "1px solid " + C.border, padding: 24, marginBottom: 14, boxShadow: theme === "light" ? C.shadow : "none" }}>
                  <div style={{ fontFamily: "'Cormorant Garamond',serif", fontStyle: "italic", fontWeight: 700, fontSize: 18, color: theme === "dark" ? C.detail : C.accent, marginBottom: 14, lineHeight: 1.3 }}>Let these prompts move you through the letter</div>
                  {lesson.letterPrompts.map((p, i) => (
                    <div key={i} style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "10px 0", borderBottom: i < lesson.letterPrompts.length - 1 ? "1px solid " + C.border : "none" }}>
                      <div style={{ fontSize: 9, fontWeight: 800, color: C.accent, letterSpacing: 1, minWidth: 22, marginTop: 2 }}>0{i + 1}</div>
                      <div style={{ fontWeight: 500, fontSize: 13, color: C.txtSec, lineHeight: 1.65 }}>{p}</div>

                  ))}
                </div>
                <div style={{ background: C.bgCard, borderRadius: 14, border: "1px solid " + C.border, padding: 22, marginBottom: 14, boxShadow: theme === "light" ? C.shadow : "none" }}>
                  <div style={{ fontFamily: "'Cormorant Garamond',serif", fontStyle: "italic", fontWeight: 700, fontSize: 17, color: theme === "dark" ? C.detail : C.accent, marginBottom: 6, lineHeight: 1.4 }}>Your Letter</div>
                  {journals[lesson.letterFieldId] && journals[lesson.letterFieldId].savedAt && (
                    <div style={{ fontSize: 8, fontWeight: 700, color: C.txtFaded, letterSpacing: 1, marginBottom: 12, textTransform: "uppercase" }}>Last saved {new Date(journals[lesson.letterFieldId].savedAt).toLocaleString()}</div>
                  )}
                  <textarea
                    value={(journals[lesson.letterFieldId] && journals[lesson.letterFieldId].text) || ""}
                    onChange={(ev) => updateJournal(lesson.letterFieldId, ev.target.value)}
                    placeholder="Dear..."
                    rows={16}
                    style={{ width: "100%", background: C.inputBg, border: "1px solid " + C.border, borderRadius: 10, padding: "16px 18px", fontSize: 14, color: C.txtSec, lineHeight: 1.8, resize: "vertical", marginTop: 8 }}
                  />
                </div>
                <SaveExportButtons
                  onSave={saveLessonJournals}
                  onExportTxt={() => exportLessonTxt(lesson)}
                  onExportPDF={() => exportLessonPDF(lesson)}
                  onExportDrive={() => exportLessonToDrive(lesson)}
                  C={C}
                  saveLabel="✦ Save Letter"
                  menuId="letter"
                  exportMenuOpen={exportMenuOpen}
                  setExportMenuOpen={setExportMenuOpen}
                />
              </div>
            )}

            <div style={{ marginTop: 44, paddingTop: 28, borderTop: "1px solid " + C.border, display: "flex", gap: 12, justifyContent: "space-between", alignItems: "center" }} className="lesson-bottom">
              {active > 0 ? (
                <button onClick={() => setActive(active - 1)} style={{ fontSize: 10, fontWeight: 700, letterSpacing: 1, color: C.txtMuted, background: "transparent", padding: "12px 22px", borderRadius: 50, border: "1px solid " + C.borderMid, cursor: "pointer", textTransform: "uppercase" }}>← Previous</button>
              ) : <span />}
              {active < MODULE_DATA.lessons.length - 1 && (
                <button onClick={() => setActive(active + 1)} style={{ fontSize: 10, fontWeight: 700, letterSpacing: 1, color: C.moonPrl, background: "linear-gradient(135deg," + C.accent + "," + C.darkMid + ")", padding: "13px 24px", borderRadius: 50, border: "none", cursor: "pointer", textTransform: "uppercase" }}>Next Lesson →</button>
              )}
            </div>

            <div style={{ marginTop: 56, paddingTop: 28, borderTop: "1px solid " + C.border, textAlign: "center" }}>
              <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 18, fontStyle: "italic", color: C.accent, marginBottom: 6 }}>You are the alchemy.</div>
              <div style={{ fontSize: 8, fontWeight: 700, color: C.txtFaded, letterSpacing: 2, textTransform: "uppercase" }}>Badass Alchemy · Baddie Society · Quantum Queen</div>
            </div>

          </div>
        </div>
      </div>
    </div>
  );
}

function SectionHeader({ icon, label, color, status }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
      <span style={{ fontSize: 16 }}>{icon}</span>
      <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 2, color: color, textTransform: "uppercase" }}>{label}</span>
      {status && <span style={{ marginLeft: "auto", fontSize: 9, fontWeight: 700, letterSpacing: 1, color: color }}>{status}</span>}
    </div>
  );
}

function SaveExportButtons({ onSave, onExportTxt, onExportPDF, onExportDrive, C, saveLabel, menuId, exportMenuOpen, setExportMenuOpen }) {
  const isOpen = exportMenuOpen === menuId;
  return (
    <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 4, position: "relative" }}>
      <button onClick={onSave} style={{ flex: 1, minWidth: 120, fontSize: 10, fontWeight: 700, letterSpacing: 1, color: C.moonPrl, background: "linear-gradient(135deg," + C.accent + "," + C.darkMid + ")", padding: "12px 20px", borderRadius: 50, border: "none", cursor: "pointer", textTransform: "uppercase" }}>{saveLabel}</button>
      <div style={{ flex: 1, minWidth: 120, position: "relative" }}>
        <button onClick={() => setExportMenuOpen(isOpen ? null : menuId)} style={{ width: "100%", fontSize: 10, fontWeight: 700, letterSpacing: 1, color: C.txt, background: "transparent", padding: "11px 20px", borderRadius: 50, border: "1px solid " + C.borderMid, cursor: "pointer", textTransform: "uppercase", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
          ⬇ Export <span style={{ fontSize: 8, marginLeft: 2 }}>{isOpen ? "▲" : "▼"}</span>
        </button>
        {isOpen && (
          <div style={{ position: "absolute", top: "calc(100% + 6px)", right: 0, left: 0, background: C.bgCard, border: "1px solid " + C.borderMid, borderRadius: 14, padding: 6, zIndex: 50, boxShadow: "0 8px 28px rgba(45,15,35,0.4)" }}>
            <button onClick={() => { onExportPDF(); setExportMenuOpen(null); }} style={{ width: "100%", textAlign: "left", padding: "11px 14px", border: "none", background: "transparent", color: C.txt, cursor: "pointer", borderRadius: 10, display: "flex", alignItems: "center", gap: 10, fontSize: 12, fontWeight: 600 }} onMouseEnter={(e) => e.currentTarget.style.background = C.inputBg} onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
              <span style={{ fontSize: 14 }}>📄</span>
              <div>
                <div style={{ fontWeight: 700 }}>Download PDF</div>
                <div style={{ fontSize: 9, color: C.txtFaded, marginTop: 1, fontWeight: 500 }}>Beautiful, printable</div>
              </div>
            </button>
            <button onClick={() => { onExportTxt(); setExportMenuOpen(null); }} style={{ width: "100%", textAlign: "left", padding: "11px 14px", border: "none", background: "transparent", color: C.txt, cursor: "pointer", borderRadius: 10, display: "flex", alignItems: "center", gap: 10, fontSize: 12, fontWeight: 600 }} onMouseEnter={(e) => e.currentTarget.style.background = C.inputBg} onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
              <span style={{ fontSize: 14 }}>📝</span>
              <div>
                <div style={{ fontWeight: 700 }}>Download .txt</div>
                <div style={{ fontSize: 9, color: C.txtFaded, marginTop: 1, fontWeight: 500 }}>Plain text backup</div>
              </div>
            </button>
            <button onClick={() => { onExportDrive(); setExportMenuOpen(null); }} style={{ width: "100%", textAlign: "left", padding: "11px 14px", border: "none", background: "transparent", color: C.txt, cursor: "pointer", borderRadius: 10, display: "flex", alignItems: "center", gap: 10, fontSize: 12, fontWeight: 600 }} onMouseEnter={(e) => e.currentTarget.style.background = C.inputBg} onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
              <span style={{ fontSize: 14 }}>☁</span>
              <div>
                <div style={{ fontWeight: 700 }}>Save to Google Drive</div>
                <div style={{ fontSize: 9, color: C.txtFaded, marginTop: 1, fontWeight: 500 }}>PDF straight to your Drive</div>
              </div>
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// Mount
document.getElementById('loading').style.display = 'none';
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
